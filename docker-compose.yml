version: "3.8"

services:
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    volumes:
      - ./frontend:/usr/src/app
      - /usr/src/app/node_modules
    command: npm run dev
    depends_on:
      - backend

  backend:
    build:
      context: ./practice1
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    volumes:
      - ./practice1:/app
    command: uvicorn app:app --host 0.0.0.0 --port 8000
